<section [class]="['banner', variant()]" [attr.role]="role()" data-testid="banner">
  <ds-icon class="banner-icon" [name]="iconName()" />
  <div class="body">
    <strong class="title">{{ heading() }}</strong>
    @if (message()) {
      <span class="message">{{ message() }}</span>
    }
    @if (meta()) {
      <span class="meta" data-testid="banner-meta">{{ meta() }}</span>
    }
  </div>
  <ng-content />
  @if (dismissible()) {
    <button
      dsBtn
      variant="ghost"
      size="sm"
      [iconOnly]="true"
      type="button"
      [attr.aria-label]="dismissLabel()"
      data-testid="banner-dismiss"
      (click)="dismiss.emit()"
    >
      <ds-icon name="x" size="sm" />
    </button>
  }
</section>
