@for (option of options(); track option.value; let index = $index) {
  <button
    type="button"
    role="radio"
    [attr.aria-checked]="option.value === value()"
    [attr.aria-disabled]="option.disabled ? 'true' : null"
    [attr.aria-label]="iconOnly() ? option.label : null"
    [attr.title]="iconOnly() ? option.label : null"
    [dsTooltip]="option.tooltip ?? ''"
    [attr.tabindex]="isTabbable(option, index) ? 0 : -1"
    [attr.data-testid]="option.testId ?? 'segmented-' + option.value"
    (click)="select(option)"
    (keydown)="onKeydown($event, index)"
  >
    @if (option.icon) {
      <ds-icon [name]="option.icon" size="sm" />
    }
    @if (!iconOnly()) {
      <span class="ds-segmented-label">{{ option.label }}</span>
    }
  </button>
}
