<div class="ds-field">
  <label class="ds-field-label" for="reading-settings-font">{{ 'library.readingSettings.font' | t }}</label>
  <span class="ds-select">
    <select
      id="reading-settings-font"
      class="ds-input"
      data-testid="reading-settings-font"
      [value]="settings().font"
      (change)="setFont($event)"
    >
      <option value="serif">{{ 'library.readingSettings.fontSerif' | t }}</option>
      <option value="sans">{{ 'library.readingSettings.fontSans' | t }}</option>
    </select>
    <ds-icon name="chevron-down" size="sm" />
  </span>
</div>

<div class="library-reading-settings-range">
  <label for="reading-settings-size">{{ 'library.readingSettings.size' | t }}</label>
  <span class="num">{{ number(settings().size) }} {{ 'library.readingSettings.px' | t }}</span>
  <input
    id="reading-settings-size"
    type="range"
    min="14"
    max="28"
    step="1"
    data-testid="reading-settings-size"
    [value]="settings().size"
    (input)="setNumber('size', $event)"
  />
</div>

<div class="library-reading-settings-range">
  <label for="reading-settings-leading">{{ 'library.readingSettings.leading' | t }}</label>
  <span class="num">{{ number(settings().leading) }}</span>
  <input
    id="reading-settings-leading"
    type="range"
    min="1.4"
    max="2.2"
    step="0.05"
    data-testid="reading-settings-leading"
    [value]="settings().leading"
    (input)="setNumber('leading', $event)"
  />
</div>

<div class="library-reading-settings-range">
  <label for="reading-settings-width">{{ 'library.readingSettings.width' | t }}</label>
  <span class="num">{{ number(settings().width) }} {{ 'library.readingSettings.ch' | t }}</span>
  <input
    id="reading-settings-width"
    type="range"
    min="48"
    max="96"
    step="2"
    data-testid="reading-settings-width"
    [value]="settings().width"
    (input)="setNumber('width', $event)"
  />
</div>

<button
  dsBtn
  variant="ghost"
  size="sm"
  type="button"
  data-testid="reading-settings-reset"
  [disabled]="!canReset()"
  (click)="reset()"
>
  <ds-icon name="retry" size="sm" />{{ 'library.readingSettings.reset' | t }}
</button>
<p class="meta">{{ 'library.readingSettings.note' | t }}</p>
