<form class="library-novel-form" novalidate (submit)="onSubmit($event)">
  @if (refusedRun(); as run) {
    <ds-banner
      variant="danger"
      data-testid="insp-edit-refused"
      [heading]="'library.novel.form.refusedHeading' | t"
      [message]="'library.novel.form.refusedMessage' | t: { run }"
      [dismissLabel]="'common.dismiss' | t"
      (dismiss)="refusedRun.set(null)"
    />
  }
  <ds-field [label]="'library.novel.info.cover' | t" [error]="coverErrorText()">
    <div class="library-novel-form-cover" data-testid="insp-edit-cover">
      <ds-library-cover
        size="sm"
        [cover]="cover()"
        [palette]="coverPalette(novel().id)"
        [originalTitle]="draft().originalTitle || draft().title"
        [language]="draft().language"
      />
      <div class="library-novel-form-cover-body">
        <span class="meta">{{ coverNoteKey() | t: coverNoteParams() }}</span>
        <button dsBtn size="sm" type="button" data-testid="insp-edit-cover-change" (click)="changeCover()">
          <ds-icon name="image" size="sm" />{{ 'library.novel.form.coverChange' | t }}
        </button>
        <button
          dsBtn
          variant="ghost"
          size="sm"
          type="button"
          data-testid="insp-edit-cover-remove"
          [disabled]="!canRemoveCover()"
          (click)="removeCover()"
        >
          <ds-icon name="image-off" size="sm" />{{ 'library.novel.form.coverRemove' | t }}
        </button>
      </div>
    </div>
  </ds-field>
  <ds-field
    required
    [label]="'library.novel.info.originalTitle' | t"
    [controlId]="fieldIds.originalTitle"
    [hint]="'library.novel.form.originalTitleHint' | t"
    [error]="errors().originalTitle ? ('library.novel.form.required' | t) : ''"
  >
    <input
      class="ds-input"
      required
      data-testid="insp-edit-original"
      [id]="fieldIds.originalTitle"
      [attr.lang]="draft().language || null"
      [value]="draft().originalTitle"
      [attr.aria-invalid]="errors().originalTitle || null"
      (input)="setText('originalTitle', $event)"
      (blur)="touch('originalTitle')"
    />
  </ds-field>
  <ds-field
    required
    [label]="'library.novel.info.title' | t"
    [controlId]="fieldIds.title"
    [hint]="'library.novel.form.titleHint' | t"
    [error]="errors().title ? ('library.novel.form.required' | t) : ''"
  >
    <input
      class="ds-input"
      required
      data-testid="insp-edit-display"
      [id]="fieldIds.title"
      [value]="draft().title"
      [attr.aria-invalid]="errors().title || null"
      (input)="setText('title', $event)"
      (blur)="touch('title')"
    />
  </ds-field>
  <ds-field [label]="'library.novel.info.author' | t" controlId="insp-edit-author">
    <input
      id="insp-edit-author"
      class="ds-input"
      data-testid="insp-edit-author"
      [value]="draft().author"
      (input)="setText('author', $event)"
    />
  </ds-field>
  <ds-field
    required
    [label]="'library.novel.info.language' | t"
    [controlId]="fieldIds.language"
    [error]="errors().language ? ('library.novel.form.required' | t) : ''"
  >
    <span class="ds-select">
      <select
        class="ds-input"
        required
        data-testid="insp-edit-language"
        [id]="fieldIds.language"
        [attr.aria-invalid]="errors().language || null"
        (change)="setText('language', $event); touch('language')"
        (blur)="touch('language')"
      >
        <option value="" [selected]="!draft().language">{{ 'library.novel.form.languagePlaceholder' | t }}</option>
        @for (option of languages(); track option.code) {
          <option [value]="option.code" [selected]="option.code === draft().language">{{ option.label }}</option>
        }
      </select>
      <ds-icon name="chevron-down" size="sm" />
    </span>
  </ds-field>
  <ds-field [label]="'library.novel.form.publication' | t" controlId="insp-edit-status">
    <span class="ds-select">
      <select class="ds-input" id="insp-edit-status" data-testid="insp-edit-status" (change)="setPublication($event)">
        <option value="ongoing" [selected]="draft().publication === 'ongoing'">
          {{ 'library.browse.publication.ongoing' | t }}
        </option>
        <option value="completed" [selected]="draft().publication === 'completed'">
          {{ 'library.browse.publication.completed' | t }}
        </option>
      </select>
      <ds-icon name="chevron-down" size="sm" />
    </span>
  </ds-field>
  <ds-field
    [label]="'library.inspector.genres' | t"
    controlId="insp-edit-genres-input"
    [hint]="'library.novel.form.tagsHint' | t"
  >
    <ds-chip-input
      inputId="insp-edit-genres-input"
      testId="insp-edit-genres"
      removeLabel="library.novel.form.removeTag"
      [values]="draft().tags"
      [placeholder]="'library.novel.form.tagsPlaceholder' | t"
      (valuesChange)="setTags($event)"
    />
  </ds-field>
  <ds-field [label]="'library.novel.info.description' | t" controlId="insp-edit-synopsis">
    <textarea
      id="insp-edit-synopsis"
      class="ds-input"
      rows="5"
      data-testid="insp-edit-synopsis"
      [attr.lang]="draft().language || null"
      [value]="draft().description"
      (input)="setText('description', $event)"
    ></textarea>
  </ds-field>
  <p class="meta">{{ 'library.novel.form.readOnlyNote' | t }}</p>
  <div class="library-novel-form-actions">
    <button dsBtn variant="ghost" size="sm" type="button" data-testid="insp-edit-cancel" (click)="cancel()">
      {{ 'common.cancel' | t }}
    </button>
    <button
      dsBtn
      variant="primary"
      size="sm"
      type="submit"
      data-testid="insp-edit-save"
      [loading]="saving()"
      [disabled]="!dirty() || saving()"
    >
      <ds-icon name="save" size="sm" />{{ 'library.novel.form.save' | t }}
    </button>
  </div>
</form>
