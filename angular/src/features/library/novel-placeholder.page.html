<div class="ds-page-toolbar" data-testid="page-toolbar">
  <h1 dsPageTitle>{{ 'library.placeholder.title' | t }}</h1>
</div>
<div class="ds-page-body center">
  <div class="ds-area-state coming-soon" data-testid="novel-placeholder">
    <ds-icon class="ds-area-state-icon" name="library" size="xl" />
    <h3 class="ds-area-state-title">{{ 'library.placeholder.title' | t }}</h3>
    <ds-pill icon="clock">{{ 'common.soon' | t }}</ds-pill>
    <p class="ds-area-state-description">{{ 'library.placeholder.desc' | t }}</p>
    <a dsBtn routerLink="/library" data-testid="novel-placeholder-back"
      ><ds-icon name="arrow-left" size="sm" />{{ 'library.placeholder.back' | t }}</a
    >
  </div>
</div>
