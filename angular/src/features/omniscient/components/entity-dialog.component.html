<ds-dialog
  data-testid="world-entity-dialog"
  [open]="!!request()"
  [icon]="icons[request()?.mode ?? 'add']"
  [heading]="heading()"
  [dismissible]="!store.busy()"
  [closeLabel]="'common.dismiss' | t"
  (closed)="close()"
>
  <div class="ds-world-detail-form">
    @if (request()?.mode !== 'type') {
      <ds-field
        controlId="world-entity-dialog-name"
        required
        [label]="'analysis.world.newName' | t"
        [error]="duplicate() ? ('analysis.entity.duplicate' | t) : ''"
      >
        <input
          id="world-entity-dialog-name"
          class="ds-input"
          data-testid="world-entity-dialog-name"
          autofocus
          [value]="name()"
          [attr.aria-invalid]="duplicate() || null"
          (input)="name.set($any($event.target).value)"
          (keydown.enter)="save()"
        />
      </ds-field>
    }
    @if (request()?.mode !== 'rename') {
      <ds-field
        controlId="world-entity-dialog-type"
        [label]="'analysis.world.typeLabel' | t"
        [error]="request()?.mode === 'type' && duplicate() ? ('analysis.entity.duplicate' | t) : ''"
      >
        <span class="ds-select">
          <select
            id="world-entity-dialog-type"
            class="ds-input"
            data-testid="world-entity-dialog-type"
            (change)="setType($event)"
          >
            @for (item of types; track item) {
              <option [value]="item" [selected]="item === type()">{{ typeKeys[item] | t }}</option>
            }
          </select>
          <ds-icon name="chevron-down" size="sm" />
        </span>
      </ds-field>
    }
    <p class="meta">{{ 'analysis.entity.sameRule' | t }}</p>
    @if (error()) {
      <p class="ds-world-detail-error" role="alert"><ds-icon name="alert-circle" size="sm" />{{ error() }}</p>
    }
  </div>
  <ng-container dialogFooter>
    <button dsBtn type="button" data-testid="world-entity-dialog-cancel" [disabled]="store.busy()" (click)="close()">
      {{ 'common.cancel' | t }}
    </button>
    <button
      dsBtn
      variant="primary"
      type="button"
      data-testid="world-entity-dialog-save"
      [loading]="store.busy()"
      [disabled]="!canSave()"
      (click)="save()"
    >
      {{ (request()?.mode === 'add' ? 'analysis.entity.add' : 'analysis.entity.save') | t }}
    </button>
  </ng-container>
</ds-dialog>
