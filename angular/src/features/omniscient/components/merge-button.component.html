@let label = pending() ? ('analysis.merge.button' | t: { count: pending() }) : ('analysis.merge.action' | t);
<span class="ds-world-merge-wrap" [dsTooltip]="reason() || label" [attr.tabindex]="reason() ? 0 : null">
  <button
    dsBtn
    type="button"
    [variant]="variant()"
    [attr.data-testid]="testId()"
    [attr.aria-label]="label"
    [disabled]="!!reason() || store.busy()"
    [loading]="store.busy()"
    (click)="merge()"
  >
    <ds-icon name="merge" size="sm" />
    <span class="ds-toolbar-label">{{ label }}</span>
    @if (reason()) {
      <span class="visually-hidden">{{ reason() }}</span>
    }
  </button>
</span>
