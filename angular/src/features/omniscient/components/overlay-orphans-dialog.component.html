<ds-dialog
  class="ds-world-ontology-dialog"
  icon="alert-triangle"
  [open]="open()"
  [heading]="'analysis.orphans.title' | t"
  [closeLabel]="'analysis.pipeline.close' | t"
  (closed)="close()"
>
  <div class="ds-world-ontology" data-testid="world-orphans-dialog">
    <p class="ds-world-run-hint">{{ 'analysis.orphans.hintEdits' | t }}</p>
    <ul class="ds-world-orphans">
      @for (orphan of orphans(); track $index) {
        <li [attr.data-testid]="'world-orphan-' + $index">
          <span class="ds-world-orphan-text">
            <span class="ds-world-orphan-kind">{{ kindKeys[orphan.kind] | t }}</span>
            <span class="ds-world-orphan-detail">{{ detail(orphan) }}</span>
          </span>
        </li>
      }
    </ul>
  </div>
</ds-dialog>
