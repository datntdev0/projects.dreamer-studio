<div
  #graphContainer
  class="analysis-world-graph"
  data-testid="world-graph"
  role="img"
  [attr.aria-label]="'analysis.graph.label' | t"
  [attr.aria-description]="
    issueCounts().errors || issueCounts().warnings ? ('analysis.graph.issueSummary' | t: issueCounts()) : null
  "
></div>
@if (!visibleCount()) {
  <ds-area-state
    class="ds-world-graph-empty"
    kind="empty"
    icon="network"
    compact
    data-testid="world-graph-empty"
    [heading]="'analysis.graph.empty' | t"
    [description]="'analysis.graph.emptyHint' | t"
  />
}
@if (predicateOptions().length) {
  <span class="ds-select ds-world-graph-filter">
    <select
      class="ds-input"
      data-testid="world-relationship-filter"
      [attr.aria-label]="'analysis.world.filterRelationship' | t"
      (change)="onPredicateChange($event)"
    >
      <option value="all" [selected]="predicate() === 'all'">{{ 'analysis.world.allRelationships' | t }}</option>
      @for (option of predicateOptions(); track option) {
        <option [value]="option" [selected]="option === predicate()">
          {{ predicateLabels().get(option) ?? option }}
        </option>
      }
    </select>
    <ds-icon name="chevron-down" size="sm" />
  </span>
}
<div class="ds-world-graph-tools" role="toolbar" [attr.aria-label]="'analysis.graph.tools' | t">
  <button
    dsBtn
    variant="ghost"
    size="sm"
    iconOnly
    type="button"
    data-testid="world-zoom-in"
    [attr.aria-label]="'analysis.world.zoomIn' | t"
    [dsTooltip]="'analysis.world.zoomIn' | t"
    (click)="zoomIn()"
  >
    <ds-icon name="plus" size="sm" />
  </button>
  <button
    dsBtn
    variant="ghost"
    size="sm"
    iconOnly
    type="button"
    data-testid="world-zoom-out"
    [attr.aria-label]="'analysis.world.zoomOut' | t"
    [dsTooltip]="'analysis.world.zoomOut' | t"
    (click)="zoomOut()"
  >
    <ds-icon name="minus" size="sm" />
  </button>
  <button
    dsBtn
    variant="ghost"
    size="sm"
    iconOnly
    type="button"
    data-testid="world-fit"
    [attr.aria-label]="'analysis.world.fit' | t"
    [dsTooltip]="'analysis.world.fit' | t"
    (click)="fit()"
  >
    <ds-icon name="maximize" size="sm" />
  </button>
</div>
<div class="ds-world-graph-legend" data-testid="world-graph-legend">
  <ul [attr.aria-label]="'analysis.graph.legend' | t">
    @for (type of types; track type) {
      <li [attr.data-testid]="'world-legend-' + type">
        <span class="ds-world-type-dot" [attr.data-type]="type"></span>{{ typeKeys[type] | t }}
      </li>
    }
    <li data-testid="world-legend-error">
      <span class="ds-world-graph-ring" data-severity="error"></span>{{ issueKeys.error | t }}
    </li>
    <li data-testid="world-legend-warning">
      <span class="ds-world-graph-ring" data-severity="warning"></span>{{ issueKeys.warning | t }}
    </li>
    <li data-testid="world-legend-hostile">
      <span class="ds-world-graph-dash"></span>{{ 'analysis.graph.hostile' | t }}
    </li>
  </ul>
</div>
