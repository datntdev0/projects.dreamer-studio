<div class="ds-page-toolbar" data-testid="page-toolbar">
  <h1 dsPageTitle>{{ 'nav.pipelines' | t }}</h1>
  <ds-tabs
    class="pipeline-tabs"
    idPrefix="pipelines-tab"
    controls="pipelines-main"
    [value]="viewStore.view()"
    [label]="'pipelines.views' | t"
    [tabs]="tabs()"
    (valueChange)="onViewChange($event)"
  />
  <div class="ds-page-actions">
    @if (showFilters()) {
      <div class="pipeline-toolbar-group" data-testid="pipelines-filters">
        <span class="ds-select">
          <select
            class="ds-input"
            data-testid="pipelines-filter-status"
            [attr.aria-label]="'pipelines.filter.status' | t"
            (change)="onStatusChange($any($event.target).value)"
          >
            @for (option of statusOptions(); track option.value) {
              <option [value]="option.value" [selected]="option.value === statusValue()">
                {{ option.label }}
              </option>
            }
          </select>
          <ds-icon name="chevron-down" size="sm" />
        </span>
        <span class="ds-select">
          <select
            class="ds-input"
            data-testid="pipelines-filter-type"
            [attr.aria-label]="'pipelines.filter.type' | t"
            (change)="onTypeChange($any($event.target).value)"
          >
            @for (option of typeOptions(); track option.value) {
              <option [value]="option.value" [selected]="option.value === typeValue()">
                {{ option.label }}
              </option>
            }
          </select>
          <ds-icon name="chevron-down" size="sm" />
        </span>
        @if (viewStore.filtered()) {
          <button
            dsBtn
            variant="ghost"
            size="sm"
            type="button"
            data-testid="pipelines-filter-clear"
            [iconOnly]="true"
            [attr.aria-label]="'pipelines.filter.clear' | t"
            [dsTooltip]="'pipelines.filter.clear' | t"
            (click)="viewStore.clearFilters()"
          >
            <ds-icon name="x" size="sm" />
          </button>
        }
      </div>
      <span class="pipeline-toolbar-sep"></span>
      <div class="pipeline-toolbar-group">
        @if (viewStore.checked().size) {
          <span class="pipeline-muted num" data-testid="pipelines-selection-count" aria-live="polite">{{
            'pipelines.selected' | t: { count: viewStore.checked().size }
          }}</span>
        }
        <button
          dsBtn
          variant="ghost"
          size="sm"
          type="button"
          data-testid="pipelines-delete"
          [disabled]="viewStore.checked().size === 0"
          (click)="deleteChecked()"
        >
          <ds-icon name="trash" size="sm" />{{ 'pipelines.action.delete' | t }}
        </button>
      </div>
      <span class="pipeline-toolbar-sep"></span>
    }
    @if (store.types().length) {
      <button
        dsBtn
        variant="primary"
        size="sm"
        type="button"
        data-testid="pipelines-start"
        (click)="startOpen.set(true)"
      >
        <ds-icon name="play" size="sm" />{{ 'pipelines.start.title' | t }}
      </button>
    }
  </div>
</div>

<div class="ds-workbench">
  <div class="ds-workbench-center">
    <main
      id="pipelines-main"
      class="pipeline-main"
      role="tabpanel"
      data-testid="pipelines-main"
      [attr.aria-labelledby]="'pipelines-tab-' + viewStore.view()"
    >
      @if (viewStore.view() === 'queue') {
        <ds-queue-table [slot]="store.active()" [selectedId]="selectedId()" />
      } @else {
        <ds-history-table [selectedId]="selectedId()" />
      }
    </main>
    <ds-splitter edge="bottom" [target]="bottom" [label]="'pipelines.resize.log' | t" />
    <aside
      #bottom
      class="ds-panel-bottom pipeline-log-panel"
      data-testid="pipeline-log-panel"
      [attr.aria-label]="'run.log.title' | t"
    >
      <ds-run-log [runId]="selectedId()" />
    </aside>
  </div>

  <ds-splitter edge="right" [target]="right" [label]="'pipelines.resize.details' | t" />
  <aside
    #right
    class="ds-panel-right pipeline-details-panel"
    data-testid="pipelines-details-panel"
    [attr.aria-label]="'pipelines.detail.label' | t"
  >
    <ds-run-details [runId]="selectedId()" />
  </aside>
</div>

<ds-start-pipeline-dialog [open]="startOpen()" (closed)="startOpen.set(false)" (started)="onStarted($event)" />
