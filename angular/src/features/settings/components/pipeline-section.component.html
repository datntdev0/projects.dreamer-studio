<section class="settings-section" aria-labelledby="settings-pipeline-title" data-testid="settings-pipeline">
  <header class="settings-section-head">
    <h3 id="settings-pipeline-title">{{ 'settings.pipeline.title' | t }}</h3>
    <div class="settings-section-actions">
      <button dsBtn variant="ghost" size="sm" type="button" data-testid="settings-pipeline-reset" (click)="reset()">
        <ds-icon name="undo" size="sm" />{{ 'settings.page.reset' | t }}
      </button>
    </div>
  </header>
  <div class="settings-group">
    @for (row of rows; track row.id) {
      @let inputId = 'settings-pipeline-' + row.id;
      <div class="settings-row" [attr.data-testid]="inputId + '-row'">
        <div class="settings-row-text">
          <label class="settings-row-label" [for]="inputId">{{ row.label | t }}</label>
          <span class="settings-row-hint" [id]="inputId + '-hint'" [attr.data-testid]="inputId + '-hint'">
            {{ row.hint | t }}
          </span>
          @if (row.setting === 'maxConcurrent' && activeCount() > 0) {
            <span class="settings-row-hint num" data-testid="settings-pipeline-active">
              {{ 'settings.pipeline.activeNow' | t: { count: activeCount() } }}
            </span>
          }
        </div>
        <div class="settings-row-control settings-range">
          <input
            type="range"
            dsRange
            step="1"
            [id]="inputId"
            [min]="limits[row.setting].min"
            [max]="limits[row.setting].max"
            [value]="values()[row.setting]"
            [attr.aria-describedby]="inputId + '-hint'"
            [attr.data-testid]="inputId"
            (input)="onInput(row.setting, $event)"
            (change)="onChange(row.setting, $event)"
          />
          <output class="ds-range-value num" [for]="inputId" [attr.data-testid]="inputId + '-value'">{{
            values()[row.setting]
          }}</output>
        </div>
      </div>
    }
  </div>
</section>
