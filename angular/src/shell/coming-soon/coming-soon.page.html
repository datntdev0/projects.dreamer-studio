@if (module(); as module) {
  <div class="ds-page-toolbar" data-testid="page-toolbar">
    <h1 dsPageTitle>{{ module.label | t }}</h1>
  </div>
  <div class="ds-page-body center">
    <div class="ds-area-state coming-soon" data-testid="coming-soon" [attr.data-module]="module.id">
      <ds-icon class="ds-area-state-icon" [name]="module.icon" size="xl" />
      <h3 class="ds-area-state-title">{{ module.label | t }}</h3>
      <ds-pill icon="clock" data-testid="coming-soon-pill">{{ 'common.soon' | t }}</ds-pill>
      <p class="ds-area-state-description" data-testid="coming-soon-desc">{{ module.description | t }}</p>
      <span class="coming-soon-release" data-testid="coming-soon-release">{{
        release().key | t: release().params
      }}</span>
      <a dsBtn routerLink="/" data-testid="coming-soon-back"
        ><ds-icon name="arrow-left" size="sm" />{{ 'soon.back' | t }}</a
      >
    </div>
  </div>
}
