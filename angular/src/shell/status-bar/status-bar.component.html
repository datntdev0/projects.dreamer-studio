@if (dataDir()) {
  <span class="item path" [title]="dataDir()" data-testid="status-data-path">
    <ds-icon name="folder" size="sm" /><span>{{ dataDir() }}</span>
  </span>
}
<button
  class="item"
  type="button"
  data-testid="status-pipeline"
  [attr.data-state]="running().length ? 'running' : 'idle'"
  (click)="openPipelines()"
>
  <ds-dot [kind]="running().length ? 'primary' : 'neutral'" [pulse]="running().length > 0" />
  <span>{{ pipelineText() }}</span>
</button>
@if (backend() !== 'running') {
  <span class="item" data-testid="status-backend" [attr.data-state]="backend()">
    <ds-dot kind="warning" [pulse]="backend() === 'starting'" />
    <span>{{ (backend() === 'starting' ? 'status.backend.starting' : 'status.backend.failed') | t }}</span>
  </span>
}
<span class="ds-spacer"></span>
<span class="item" data-testid="status-lang-theme">{{ langTheme() }}</span>
