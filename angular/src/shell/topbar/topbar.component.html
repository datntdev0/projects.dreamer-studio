<button
  class="ds-app-brand"
  type="button"
  data-testid="topbar-brand"
  [attr.aria-expanded]="railExpanded()"
  [dsTooltip]="'topbar.toggleSidebar' | t"
  (click)="toggleRail.emit()"
>
  <img class="ds-brand-mark ds-only-dark" src="brand/dreamer-studio-mark-dark.svg" alt="" />
  <img class="ds-brand-mark ds-only-light" src="brand/dreamer-studio-mark-light.svg" alt="" />
  <span>{{ 'app.name' | t }}</span>
  @if (appInfo.info(); as info) {
    <span class="version" data-testid="topbar-version">v{{ info.version }}</span>
  }
</button>
<nav class="ds-app-crumbs" [attr.aria-label]="'topbar.crumbs' | t" data-testid="topbar-crumbs">
  @if (currentModule(); as module) {
    <span>{{ groupTitles[module.group] | t }}</span>
    <span class="sep">·</span>
    <span class="page">{{ module.label | t }}</span>
  }
</nav>
<span class="ds-spacer"></span>
<span class="ds-app-tools">
  <button
    dsBtn
    class="lang"
    variant="ghost"
    size="sm"
    type="button"
    data-testid="topbar-lang"
    [attr.aria-label]="'topbar.language' | t"
    [dsTooltip]="'topbar.language' | t"
    (click)="toggleLanguage()"
  >
    <ds-icon name="languages" size="sm" />{{ i18n.language() === 'en' ? 'EN' : 'VI' }}
  </button>
  <button
    dsBtn
    variant="ghost"
    [iconOnly]="true"
    type="button"
    data-testid="topbar-theme"
    [attr.aria-label]="'topbar.theme' | t"
    [dsTooltip]="'topbar.theme' | t"
    (click)="toggleTheme()"
  >
    <ds-icon class="ds-only-light" name="sun" /><ds-icon class="ds-only-dark" name="moon" />
  </button>
  <button
    dsBtn
    variant="ghost"
    [iconOnly]="true"
    type="button"
    data-testid="topbar-settings"
    [attr.aria-label]="'nav.settings' | t"
    [dsTooltip]="'nav.settings' | t"
    routerLink="/settings"
  >
    <ds-icon name="settings" />
  </button>
</span>
